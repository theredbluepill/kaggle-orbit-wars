[package]
name = "smart-buildings-engine"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Native thermal and HVAC timestep for the Smart Buildings competition"

[dependencies]
faer = { version = "0.24.4", default-features = false, features = ["std", "sparse-linalg"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
